
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRCode Generator | Rex International</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 20px;
    padding: 30px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .logo { text-align: center; margin-bottom: 20px; }
  .logo h1 { font-size: 1.7rem; color: #333; }
  .logo small { color: #888; font-size: 0.85rem; }

  .tabs {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 18px; padding: 6px;
    background: #f3f4f6; border-radius: 12px;
  }
  .tab {
    flex: 1; min-width: 60px; padding: 8px 6px;
    border: none; background: transparent; border-radius: 8px;
    font-size: 0.75rem; font-weight: 600; color: #666;
    cursor: pointer; transition: all 0.2s;
  }
  .tab:hover { background: #e5e7eb; }
  .tab.active {
    background: linear-gradient(135deg, #667eea, #764ba2); color: white;
  }

  .form-section { display: none; }
  .form-section.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .input-group { margin-bottom: 12px; }
  label {
    display: block; margin-bottom: 5px;
    font-weight: 600; color: #333; font-size: 0.85rem;
  }
  input[type="text"], input[type="url"], input[type="email"],
  input[type="tel"], textarea, select {
    width: 100%; padding: 10px 12px;
    border: 2px solid #e0e0e0; border-radius: 10px;
    font-size: 0.95rem; font-family: inherit; transition: border 0.3s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: #667eea;
  }
  textarea { resize: vertical; min-height: 60px; }

  .options {
    display: grid; grid-template-columns: 1fr;
    gap: 10px; margin: 15px 0;
  }

  .btn-generate {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: transform 0.2s;
  }
  .btn-generate:hover { transform: translateY(-2px); }
  .btn-generate:disabled { opacity: 0.7; cursor: not-allowed; }

  .qr-result { margin-top: 22px; display: none; }
  .qr-result.show { display: block; }
  .qr-box {
    background: #f8f9fa; border: 2px dashed #ccc;
    border-radius: 12px; padding: 18px;
    text-align: center; margin-bottom: 12px;
  }
  .qr-box canvas {
    max-width: 100%; height: auto; border-radius: 8px;
  }

  .action-buttons {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-bottom: 15px;
  }
  .btn-action {
    padding: 11px; border: none; border-radius: 10px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 6px; transition: all 0.2s;
  }
  .btn-download { background: #10b981; color: white; }
  .btn-download:hover { background: #059669; }
  .btn-copy { background: #6366f1; color: white; }
  .btn-copy:hover { background: #4f46e5; }

  .share-section {
    padding-top: 15px; border-top: 1px solid #eee;
  }
  .share-section h3 {
    font-size: 0.9rem; margin-bottom: 10px;
    color: #555; text-align: center;
  }
  .share-buttons {
    display: flex; justify-content: center;
    flex-wrap: wrap; gap: 8px;
  }
  .share-btn {
    width: 44px; height: 44px; border: none;
    border-radius: 12px; cursor: pointer; color: white;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
  }
  .share-btn:hover { transform: translateY(-3px); }
  .share-btn svg { width: 22px; height: 22px; fill: white; }
  .share-btn.whatsapp { background: #25D366; }
  .share-btn.facebook { background: #1877F2; }
  .share-btn.twitter { background: #000; }
  .share-btn.linkedin { background: #0A66C2; }
  .share-btn.telegram { background: #0088cc; }
  .share-btn.email { background: #EA4335; }
  .share-btn.native { background: linear-gradient(135deg, #667eea, #764ba2); }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #333; color: white; padding: 12px 24px;
    border-radius: 50px; opacity: 0; transition: all 0.4s;
    z-index: 1000; font-size: 0.9rem;
  }
  .toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }
  .footer {
    text-align: center; margin-top: 18px;
    font-size: 0.8rem; color: #999;
  }
  .hint { font-size: 0.75rem; color: #888; margin-top: 4px; }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>⬛ QRCode Generator</h1>
      <small>by Rex International</small>
    </div>

    <div class="tabs">

      <button class="tab" data-type="text">📝 Text</button>

      <button class="tab" data-type="email">📧 Email</button>

            <option value="WPA">WPA/WPA2</option>
            <option value="WEP">WEP</option>
            <option value="nopass">None (Open)</option>
          </select>

      </div>
      <div class="form-section" data-form="sms">
        <div class="input-group">
          <label>Phone Number</label>
          <input type="tel" id="input-sms-phone" placeholder="+255...">

        <div class="input-group">

          <input type="text" id="input-vcard-name" placeholder="John Doe">

        <div class="input-group">
          <label>Email</label>
          <input type="email" id="input-vcard-email" placeholder="john@example.com">
        </div>
        <div class="input-group">
          <label>Company</label>
          <input type="text" id="input-vcard-company" placeholder="Rex International">

      </div>
      <div class="form-section" data-form="pdf">
        <div class="input-group">
          <label>PDF / Document URL</label>
          <input type="url" id="input-pdf" placeholder="https://drive.google.com/file/...">
          <p class="hint">Paste a link to your PDF</p>
        </div>
      </div>
    </div>

    <div class="options">
      <div>
        <label>Size</label>
        <select id="qr-size">
          <option value="4">Small</option>
          <option value="6" selected>Medium</option>
          <option value="8">Large</option>
          <option value="10">X-Large</option>
        </select>
      </div>
    </div>

    <button class="btn-generate" id="generate-btn">⚡ Generate QR Code</button>

    <div class="qr-result" id="qr-result">
      <div class="qr-box">
        <canvas id="qr-canvas"></canvas>
      </div>
      <div class="action-buttons">
        <button class="btn-action btn-download" id="download-btn">💾 Download</button>
        <button class="btn-action btn-copy" id="copy-btn">📋 Copy Image</button>
      </div>

<script>
  let currentType = 'url';
  let qrDataUrl = '';

  const $ = id => document.getElementById(id);
  const tabs = document.querySelectorAll('.tab');
  const forms = document.querySelectorAll('.form-section');
  const generateBtn = $('generate-btn');
  const qrResult = $('qr-result');
  const qrCanvas = $('qr-canvas');
  const downloadBtn = $('download-btn');
  const copyBtn = $('copy-btn');
  const toastEl = $('toast');

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentType = tab.dataset.type;
      forms.forEach(f => f.classList.remove('active'));
      document.querySelector(`[data-form="${currentType}"]`).classList.add('active');
    });
  });

  function buildQrData() {
    switch (currentType) {
      case 'url': return $('input-url').value.trim();
      case 'text': return $('input-text').value.trim();
      case 'phone': {
        const p = $('input-phone').value.trim();
        return p ? 'tel:' + p : '';
      }
      case 'email': {
        const e = $('input-email').value.trim();
        if (!e) return '';
        const s = $('input-email-subject').value.trim();
        const b = $('input-email-body').value.trim();
        let m = 'mailto:' + e;
        const p = [];
        if (s) p.push('subject=' + encodeURIComponent(s));
        if (b) p.push('body=' + encodeURIComponent(b));
        if (p.length) m += '?' + p.join('&');
        return m;
      }
      case 'wifi': {
        const ssid = $('input-wifi-ssid').value.trim();
        if (!ssid) return '';
        const pass = $('input-wifi-pass').value.trim();
        const enc = $('input-wifi-enc').value;
        return 'WIFI:T:' + enc + ';S:' + ssid + ';P:' + pass + ';;';
      }
      case 'sms': {
        const ph = $('input-sms-phone').value.trim();
        if (!ph) return '';
        const msg = $('input-sms-msg').value.trim();
        return 'sms:' + ph + (msg ? '?body=' + encodeURIComponent(msg) : '');
      }
      case 'vcard': {
        const n = $('input-vcard-name').value.trim();
        if (!n) return '';
        const ph = $('input-vcard-phone').value.trim();
        const em = $('input-vcard-email').value.trim();
        const co = $('input-vcard-company').value.trim();
        return 'BEGIN:VCARD\nVERSION:3.0\nFN:' + n + '\nORG:' + co + '\nTEL:' + ph + '\nEMAIL:' + em + '\nEND:VCARD';
      }
      case 'pdf': return $('input-pdf').value.trim();
      default: return '';
    }
  }

  function generateQR() {
    const data = buildQrData();
    if (!data) {
      showToast('⚠️ Please fill in the required fields!');
      return;
    }

    const cellSize = parseInt($('qr-size').value);

    try {
      const qr = qrcode(0, 'M');
      qr.addData(data);
      qr.make();

      const count = qr.getModuleCount();
      const totalSize = count * cellSize;

      qrCanvas.width = totalSize;
      qrCanvas.height = totalSize;
      const ctx = qrCanvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, totalSize, totalSize);

      ctx.fillStyle = '#000000';
      for (let row = 0; row < count; row++) {
        for (let col = 0; col < count; col++) {
          if (qr.isDark(row, col)) {
            ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
          }
        }
      }

      qrDataUrl = qrCanvas.toDataURL('image/png');
      qrResult.classList.add('show');
      showToast('✅ QR Code generated successfully!');
    } catch (err) {
      console.error(err);
      showToast('❌ Error: ' + err.message);
    }
  }

  generateBtn.addEventListener('click', generateQR);

  document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') generateQR();
  });

  downloadBtn.addEventListener('click', () => {
    if (!qrDataUrl) {
      showToast('⚠️ Generate a QR code first!');
      return;
    }
    const link = document.createElement('a');
    link.href = qrDataUrl;
    link.download = 'rex-qrcode-' + currentType + '-' + Date.now() + '.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast('💾 Downloaded! Check your files.');
  });

  copyBtn.addEventListener('click', async () => {
    if (!qrDataUrl) {
      showToast('⚠️ Generate a QR code first!');
      return;
    }

    try {
      const res = await fetch(qrDataUrl);
      const blob = await res.blob();
      await navigator.clipboard.write([
        new ClipboardItem({ 'image/png': blob })
      ]);
      showToast('📋 QR image copied to clipboard!');
      return;
    } catch (e) {
      console.log('Clipboard API failed, trying fallback...');
    }

    try {
      qrCanvas.setAttribute('tabindex', '0');
      qrCanvas.focus();
      const range = document.createRange();
      range.selectNode(qrCanvas);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand('copy');
      sel.removeAllRanges();
      showToast('📋 Copied! Paste it anywhere.');
    } catch (e2) {
      showToast('⚠️ Copy failed. Use Download instead, then share the file.');
    }
  });

  function downloadAndNotify() {
    const link = document.createElement('a');
    link.href = qrDataUrl;
    link.download = 'rex-qrcode.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  document.querySelectorAll('.share-btn[data-platform]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!qrDataUrl) {
        showToast('⚠️ Generate a QR code first!');
        return;
      }

      const platform = btn.dataset.platform;
      const pageUrl = window.location.href;
      const text = 'I created this QR Code with Rex International QR Generator! Try it: ' + pageUrl;

      downloadAndNotify();

      let url = '';
      switch (platform) {
        case 'whatsapp':
          url = 'https://wa.me/?text=' + encodeURIComponent(text + '\n\n📎 QR image downloaded! Attach it to your message.');
          break;
        case 'facebook':
          url = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(pageUrl);
          break;
        case 'twitter':
          url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text);
          break;
        case 'linkedin':
          url = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(pageUrl);
          break;
        case 'telegram':
          url = 'https://t.me/share/url?url=' + encodeURIComponent(pageUrl) + '&text=' + encodeURIComponent(text);
          break;
        case 'email':
          url = 'mailto:?subject=' + encodeURIComponent('QR Code from Rex International') + '&body=' + encodeURIComponent(text + '\n\n📎 The QR image has been downloaded. Attach it to this email.');
          break;
      }
      if (url) {
        window.open(url, '_blank', 'width=600,height=500');
        showToast('💾 QR downloaded + ' + platform + ' opened! Attach the image.');
      }
    });
  });

  $('native-share-btn').addEventListener('click', async () => {
    if (!qrDataUrl) {
      showToast('⚠️ Generate a QR code first!');
      return;
    }

    if (navigator.share) {
      try {
        const res = await fetch(qrDataUrl);
        const blob = await res.blob();
        const file = new File([blob], 'rex-qrcode.png', { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'QR Code - Rex International',
            text: 'Check out this QR Code!',
            files: [file]
          });
          showToast('✅ Shared successfully!');
          return;
        }
      } catch (err) {
        if (err.name === 'AbortError') return;
      }

      try {
        await navigator.share({
          title: 'QR Code - Rex International',
          text: 'Create your QR codes free!',
          url: window.location.href
        });
        showToast('✅ Shared!');
      } catch (err) {
        if (err.name !== 'AbortError') {
          downloadAndNotify();
          showToast('💾 Downloaded! Share from your gallery.');
        }
      }
    } else {
      downloadAndNotify();
      showToast('💾 Downloaded! Share the image from your files.');
    }
  });
</script>
